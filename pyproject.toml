[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctx-squeeze"
version = "0.1.0"
description = "Fit long documents and chat transcripts into an LLM token budget"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "amandah47" }]
keywords = ["llm", "context", "prompt", "tokens", "compaction", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Text Processing :: General",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
"ctx-squeeze" = "ctx_squeeze.cli:main"

[tool.setuptools]
packages = ["ctx_squeeze"]
